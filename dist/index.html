<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Open-Meteoを使った無料の天気予報テストアプリ" />
  <title>そらよみ — 天気予報テスト</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23131c3a'/%3E%3Ccircle cx='27' cy='27' r='12' fill='%23ffd166'/%3E%3Cpath d='M17 47c2-8 8-12 16-10 3-6 13-4 14 3 6 0 9 3 10 7H17Z' fill='%23bde4ff'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#111a35;--muted:#65708e;--navy:#172451;--sky:#eff8ff;--card:#fff;--line:#dce5f4;--sun:#ffc74f;--blue:#4b8df8;--rain:#6aa5d9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#dff3ff 0,#f6f9ff 50%,#e8edff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100vh}.wrap{max-width:1060px;margin:0 auto;padding:28px 22px 48px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{display:flex;gap:11px;align-items:center;font-weight:800;font-size:1.25rem;letter-spacing:.02em}.mark{width:39px;height:39px;background:var(--navy);border-radius:14px;display:grid;place-items:center;font-size:22px;box-shadow:0 9px 20px #17245136}.tag{font-size:.8rem;color:#39517d;background:#ffffffa8;border:1px solid #ffffff;padding:7px 11px;border-radius:999px}.search-panel{background:var(--navy);border-radius:26px;padding:28px;box-shadow:0 20px 45px #233b7829;color:#fff}.eyebrow{font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;color:#a9c7ff;margin:0 0 8px}.search-panel h1{font-size:clamp(1.65rem,4vw,2.45rem);margin:0 0 21px;letter-spacing:-.04em}.search{display:flex;gap:10px}.search input{flex:1;border:0;border-radius:13px;padding:15px 17px;font-size:1rem;outline:3px solid transparent}.search input:focus{outline-color:#89b6ff}.search button{border:0;border-radius:13px;background:var(--sun);color:#382700;padding:0 21px;font-size:1rem;font-weight:800;cursor:pointer}.search button:hover{filter:brightness(1.05)}.hint{font-size:.85rem;color:#b8cbf3;margin:13px 1px 0}.status{min-height:25px;margin:18px 3px 8px;color:#365584;font-size:.93rem}.weather{display:none;grid-template-columns:1.15fr 1.85fr;gap:18px}.weather.show{display:grid}.current,.forecast{background:#ffffffdc;border:1px solid #fff;border-radius:22px;box-shadow:0 12px 30px #3d588015;padding:23px}.place{font-size:1.15rem;font-weight:800;margin:0}.updated{font-size:.8rem;color:var(--muted);margin:5px 0 23px}.now{display:flex;align-items:center;gap:15px}.icon{font-size:4.15rem;line-height:1}.temp{font-size:3.5rem;font-weight:800;letter-spacing:-.08em}.condition{font-weight:700;margin-top:2px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}.detail{background:var(--sky);padding:12px;border-radius:13px;font-size:.78rem;color:var(--muted)}.detail strong{display:block;color:var(--ink);font-size:1rem;margin-top:4px}.forecast h2{font-size:1.05rem;margin:1px 0 16px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{padding:12px 6px;border-radius:14px;text-align:center;background:#f6f9fe}.day:first-child{background:#e4efff}.day-name{font-size:.77rem;color:var(--muted)}.day-icon{font-size:1.6rem;margin:8px 0}.high{font-weight:800;font-size:.92rem}.low{font-size:.78rem;color:var(--muted);margin-top:3px}.source{font-size:.78rem;color:#667699;margin:19px 2px 0}.source a{color:#426eae}@media(max-width:760px){.wrap{padding:20px 14px 34px}.tag{display:none}.search-panel{padding:22px 18px;border-radius:21px}.search{flex-direction:column}.search button{padding:14px}.weather.show{grid-template-columns:1fr}.days{overflow-x:auto;grid-template-columns:repeat(7,70px);padding-bottom:3px}.forecast{overflow:hidden}}@media(max-width:390px){.details{gap:7px}.current,.forecast{padding:18px}.temp{font-size:3rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="brand"><span class="mark">⛅</span>そらよみ</div><span class="tag">Free weather API tester</span></header>
    <section class="search-panel" aria-labelledby="title"><p class="eyebrow">Weather forecast</p><h1 id="title">今日の空を、すぐ確認。</h1><form class="search" id="form"><input id="query" type="search" autocomplete="off" placeholder="都市名を入力（例：東京、大阪、札幌）" aria-label="都市名" value="東京" /><button type="submit">天気を見る</button></form><p class="hint">都市名は日本語・英語どちらでも検索できます</p></section>
    <p class="status" id="status" role="status">東京の天気を読み込んでいます…</p>
    <section class="weather" id="weather" aria-live="polite"><article class="current"><p class="place" id="place">—</p><p class="updated" id="updated">—</p><div class="now"><span class="icon" id="nowIcon">☀️</span><div><div class="temp" id="temp">—°</div><div class="condition" id="condition">—</div></div></div><div class="details"><div class="detail">降水確率<strong id="rain">—</strong></div><div class="detail">風速<strong id="wind">—</strong></div></div></article><article class="forecast"><h2>7日間の予報</h2><div class="days" id="days"></div></article></section>
    <p class="source">データ提供：<a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open‑Meteo</a>（無料・APIキー不要）</p>
  </main>
  <script>
    const $=s=>document.querySelector(s), labels={0:['☀️','晴れ'],1:['🌤️','おおむね晴れ'],2:['⛅','一部くもり'],3:['☁️','くもり'],45:['🌫️','霧'],48:['🌫️','霧氷'],51:['🌦️','弱い霧雨'],53:['🌦️','霧雨'],55:['🌧️','強い霧雨'],61:['🌧️','弱い雨'],63:['🌧️','雨'],65:['🌧️','強い雨'],71:['🌨️','弱い雪'],73:['🌨️','雪'],75:['❄️','大雪'],80:['🌦️','にわか雨'],81:['🌧️','にわか雨'],82:['⛈️','激しいにわか雨'],95:['⛈️','雷雨'],96:['⛈️','雷雨・ひょう'],99:['⛈️','激しい雷雨']};
    const desc=c=>labels[c]||['🌡️','天気情報なし']; const dayName=d=>['日','月','火','水','木','金','土'][new Date(d+'T12:00:00').getDay()];
    async function load(q){const status=$('#status');$('#weather').classList.remove('show');status.textContent='場所を検索しています…';try{const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=ja&format=json');const geo=await g.json();if(!geo.results?.length)throw new Error('都市が見つかりませんでした。別の名前でお試しください。');const p=geo.results[0], url=`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;status.textContent='天気予報を取得しています…';const w=await (await fetch(url)).json();if(!w.current)throw new Error('天気情報を取得できませんでした。');const [ico,text]=desc(w.current.weather_code);$('#place').textContent=p.name+(p.admin1?'・'+p.admin1:'');$('#updated').textContent='現在 '+new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date());$('#nowIcon').textContent=ico;$('#temp').textContent=Math.round(w.current.temperature_2m)+'°';$('#condition').textContent=text;$('#rain').textContent=w.daily.precipitation_probability_max[0]+'%';$('#wind').textContent=Math.round(w.current.wind_speed_10m)+' km/h';$('#days').innerHTML=w.daily.time.map((d,i)=>{const [e,t]=desc(w.daily.weather_code[i]);return `<div class="day"><div class="day-name">${i===0?'今日':dayName(d)}</div><div class="day-icon" title="${t}">${e}</div><div class="high">${Math.round(w.daily.temperature_2m_max[i])}°</div><div class="low">${Math.round(w.daily.temperature_2m_min[i])}°</div></div>`}).join('');$('#weather').classList.add('show');status.textContent='';}catch(e){status.textContent=e.message||'読み込みに失敗しました。通信環境を確認して再度お試しください。';}}
    $('#form').addEventListener('submit',e=>{e.preventDefault();const q=$('#query').value.trim();if(q)load(q)});load('東京');
  </script>
</body>
</html>
