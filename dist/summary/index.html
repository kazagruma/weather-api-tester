<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gemini APIで文章を要約するシンプルなツール" />
  <title>ことのは要約 — Gemini API</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317274d'/%3E%3Cpath d='M20 18h24v28H20z' fill='%23fff'/%3E%3Cpath d='M25 26h14M25 32h14M25 38h9' stroke='%234c84ef' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#13234a;--muted:#6c7897;--blue:#3f77ea;--navy:#17274d;--pale:#edf3ff;--line:#dbe4f4;--white:#fff;--danger:#b23852}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e7f2ff,#f8fbff 52%,#eef0ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink)}main{max-width:1020px;margin:auto;padding:30px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem}.brand i{font-style:normal;background:var(--navy);padding:8px 10px;border-radius:12px}.back{font-size:.9rem;color:#4064a5;text-decoration:none}.hero{background:var(--navy);color:#fff;padding:31px;border-radius:26px;box-shadow:0 18px 44px #203a7625}.eyebrow{margin:0 0 9px;color:#99bbff;font-size:.78rem;letter-spacing:.12em}.hero h1{margin:0;font-size:clamp(1.7rem,4vw,2.45rem);letter-spacing:-.04em}.hero p{margin:10px 0 0;color:#c7d7fb}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-top:18px}.card{background:#fffffff2;border:1px solid #fff;border-radius:22px;padding:23px;box-shadow:0 12px 28px #45598014}label{font-size:.88rem;font-weight:800;display:block;margin-bottom:8px}.help{font-size:.78rem;color:var(--muted);margin:-2px 0 13px}input,textarea{font:inherit;color:var(--ink);width:100%;border:1px solid var(--line);background:#fbfdff;border-radius:12px;padding:12px;outline:0}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3f77ea20}textarea{height:265px;resize:vertical;line-height:1.65}.format{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.format label{font-weight:600;font-size:.84rem;margin:0;cursor:pointer}.format input{width:auto;accent-color:var(--blue);margin-right:4px}.submit{width:100%;border:0;background:var(--blue);color:#fff;padding:14px 18px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}.submit:hover{filter:brightness(1.06)}.submit:disabled{opacity:.6;cursor:wait}.result{min-height:356px;white-space:pre-wrap;line-height:1.72;font-size:.96rem}.empty{color:var(--muted);padding-top:5px}.notice{margin-top:18px;font-size:.8rem;color:#607195;line-height:1.6}.error{color:var(--danger);margin-top:12px;font-size:.88rem;min-height:20px}@media(max-width:760px){main{padding:20px 14px 40px}.top{margin-bottom:20px}.hero{padding:24px 20px;border-radius:21px}.grid{grid-template-columns:1fr}.card{padding:19px}.result{min-height:190px}}
  </style>
</head>
<body>
  <main>
    <div class="top"><div class="brand"><i>✦</i>ことのは要約</div><a class="back" href="/">← 天気アプリへ</a></div>
    <section class="hero"><p class="eyebrow">GEMINI API · TEXT SUMMARY</p><h1>長い文章を、読みやすく。</h1><p>Gemini の無料枠で要約を試せる、キーを保存しないシンプルなツールです。</p></section>
    <section class="grid">
      <form class="card" id="form">
        <label for="key">Gemini APIキー</label><p class="help">この画面内だけで使用し、保存しません。</p><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" required />
        <label for="text" style="margin-top:18px">要約したい文章</label><textarea id="text" placeholder="ここに文章を貼り付けてください" required></textarea>
        <div class="format" role="radiogroup" aria-label="要約形式"><label><input type="radio" name="style" value="短く、3文以内で" checked />短く</label><label><input type="radio" name="style" value="重要な点を箇条書きで5点以内に" />箇条書き</label><label><input type="radio" name="style" value="背景と結論が分かるように、丁寧に" />詳しく</label></div>
        <button class="submit" id="submit" type="submit">Geminiで要約する</button><p class="error" id="error" role="alert"></p>
      </form>
      <section class="card"><label>要約結果</label><div class="result" id="result"><span class="empty">文章とAPIキーを入力して、「Geminiで要約する」を押してください。</span></div></section>
    </section>
    <p class="notice">APIキーはブラウザから Gemini API へ直接送信されます。共有PCでは使用せず、Google AI Studio で Gemini API 専用に制限したキーを使ってください。</p>
  </main>
  <script>
    const form=document.querySelector('#form'), key=document.querySelector('#key'), text=document.querySelector('#text'), result=document.querySelector('#result'), error=document.querySelector('#error'), button=document.querySelector('#submit');
    form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const apiKey=key.value.trim(),source=text.value.trim(),style=document.querySelector('input[name="style"]:checked').value;if(!apiKey||!source)return;button.disabled=true;button.textContent='要約しています…';result.textContent='Geminiが文章を読んでいます…';try{const prompt=`次の文章を日本語で要約してください。形式は「${style}」。事実関係を補わず、元の文章にない情報は書かないでください。\n\n文章:\n${source}`;const response=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({model:'gemini-3.6-flash',input:prompt,store:false})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'Gemini APIに接続できませんでした。');const output=(data.steps||[]).flatMap(step=>step.content||[]).filter(part=>part.type==='text').map(part=>part.text||'').join('').trim();if(!output)throw new Error('要約結果を取得できませんでした。');result.textContent=output;}catch(err){result.innerHTML='<span class="empty">ここに要約結果が表示されます。</span>';error.textContent=err.message.includes('API key')?'APIキーを確認してください。':err.message;}finally{button.disabled=false;button.textContent='Geminiで要約する';}});
  </script>
</body>
</html>
