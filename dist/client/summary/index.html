<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gemini APIで文章を要約するシンプルなツール" />
  <title>ことのは要約 — Gemini API</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317274d'/%3E%3Cpath d='M20 18h24v28H20z' fill='%23fff'/%3E%3Cpath d='M25 26h14M25 32h14M25 38h9' stroke='%234c84ef' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#13234a;--muted:#6c7897;--blue:#3f77ea;--navy:#17274d;--pale:#edf3ff;--line:#dbe4f4;--white:#fff;--danger:#b23852;--gold:#ffc94d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e7f2ff,#f8fbff 52%,#eef0ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink)}main{max-width:1080px;margin:auto;padding:30px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem}.brand i{font-style:normal;background:var(--navy);padding:8px 10px;border-radius:12px}.back{font-size:.9rem;color:#4064a5;text-decoration:none}.hero{background:var(--navy);color:#fff;padding:31px;border-radius:26px;box-shadow:0 18px 44px #203a7625}.eyebrow{margin:0 0 9px;color:#99bbff;font-size:.78rem;letter-spacing:.12em}.hero h1{margin:0;font-size:clamp(1.7rem,4vw,2.45rem);letter-spacing:-.04em}.hero p{margin:10px 0 0;color:#c7d7fb}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-top:18px}.card{background:#fffffff2;border:1px solid #fff;border-radius:22px;padding:23px;box-shadow:0 12px 28px #45598014}label{font-size:.88rem;font-weight:800;display:block;margin-bottom:8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.help{font-size:.78rem;color:var(--muted);margin:-2px 0 13px}input,textarea,select{font:inherit;color:var(--ink);width:100%;border:1px solid var(--line);background:#fbfdff;border-radius:12px;padding:12px;outline:0}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3f77ea20}textarea{height:238px;resize:vertical;line-height:1.65}.metadata{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.metadata label{font-size:.79rem}.format{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.format label{font-weight:600;font-size:.84rem;margin:0;cursor:pointer}.format input{width:auto;accent-color:var(--blue);margin-right:4px}.submit{width:100%;border:0;background:var(--blue);color:#fff;padding:14px 18px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}.submit:hover,.sort.active{filter:brightness(1.06)}.submit:disabled{opacity:.6;cursor:wait}.result{min-height:356px;white-space:pre-wrap;line-height:1.72;font-size:.96rem}.empty{color:var(--muted);padding-top:5px}.notice{margin-top:18px;font-size:.8rem;color:#607195;line-height:1.6}.error{color:var(--danger);margin-top:12px;font-size:.88rem;min-height:20px}.history{margin-top:20px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 11px}.history h2{margin:0;font-size:1.1rem}.sorts{display:flex;gap:6px;flex-wrap:wrap}.sort{border:1px solid var(--line);background:#fff;color:#4064a5;border-radius:999px;padding:7px 10px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}.sort.active{background:var(--navy);border-color:var(--navy);color:#fff}.search{position:relative;margin-bottom:12px}.search input{padding-left:39px}.search span{position:absolute;left:14px;top:11px;color:#66789f}.history-list{display:grid;gap:10px}.history-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.history-meta{display:flex;gap:7px;flex-wrap:wrap;color:#59709d;font-size:.76rem;margin-bottom:8px}.pill{background:var(--pale);border-radius:999px;padding:4px 8px;font-weight:700}.history-title{font-size:.96rem;font-weight:800;margin:0 0 7px}.history-output{white-space:pre-wrap;line-height:1.6;margin:0;color:#27385e;font-size:.9rem}.history-input{margin:9px 0 0;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-empty{padding:20px;color:var(--muted);text-align:center;border:1px dashed #cbd8ef;border-radius:16px;background:#ffffff80}.saved{color:#16704e;min-height:20px;font-size:.85rem;margin:10px 0 0}@media(max-width:760px){main{padding:20px 14px 40px}.top{margin-bottom:20px}.hero{padding:24px 20px;border-radius:21px}.grid{grid-template-columns:1fr}.card{padding:19px}.result{min-height:190px}.metadata{grid-template-columns:1fr}.history-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <div class="top"><div class="brand"><i>✦</i>ことのは要約</div><a class="back" href="/">← 天気アプリへ</a></div>
    <section class="hero"><p class="eyebrow">GEMINI API · TEXT SUMMARY</p><h1>長い文章を、読みやすく。</h1><p>Gemini の無料枠で要約を試せる、キーを保存しないシンプルなツールです。</p></section>
    <section class="grid">
      <form class="card" id="form">
        <label for="key">Gemini APIキー</label><p class="help">この画面内だけで使用し、保存しません。</p><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" required />
        <label for="text" style="margin-top:18px">要約したい文章</label><textarea id="text" placeholder="ここに文章を貼り付けてください" required></textarea>
        <div class="metadata"><label for="title">タイトル・メモ<input id="title" placeholder="例：会議メモ" /></label><label for="category">カテゴリ<input id="category" list="category-list" placeholder="例：仕事" /><datalist id="category-list"><option value="仕事"><option value="学習"><option value="暮らし"><option value="アイデア"></datalist></label><label for="summary-date">日付<input id="summary-date" type="date" /></label><label for="tags">タグ<input id="tags" placeholder="例：会議, 来週" /></label></div>
        <div class="format" role="radiogroup" aria-label="要約形式"><label><input type="radio" name="style" value="short" checked />短く</label><label><input type="radio" name="style" value="bullets" />箇条書き</label><label><input type="radio" name="style" value="detailed" />詳しく</label></div>
        <button class="submit" id="submit" type="submit">Geminiで要約して保存</button><p class="error" id="error" role="alert"></p><p class="saved" id="saved" aria-live="polite"></p>
      </form>
      <section class="card"><label>要約結果</label><div class="result" id="result"><span class="empty">文章とAPIキーを入力して、「Geminiで要約する」を押してください。</span></div></section>
    </section>
    <section class="history"><div class="history-head"><h2>保存した要約</h2><div class="sorts" aria-label="並び替え"><button class="sort active" type="button" data-sort="newest">新しい順</button><button class="sort" type="button" data-sort="oldest">古い順</button><button class="sort" type="button" data-sort="date_desc">日付が新しい順</button><button class="sort" type="button" data-sort="date_asc">日付が古い順</button></div></div><div class="search"><span>⌕</span><label class="sr-only" for="search">保存した要約を検索</label><input id="search" type="search" placeholder="キーワードで検索（入力文・要約・カテゴリ・タグ）" /></div><div class="history-list" id="history-list" aria-live="polite"></div></section>
    <p class="notice">APIキーはブラウザから Gemini API へ直接送信され、保存しません。要約履歴はこのブラウザだけが開ける専用の保存場所に保管されます。共有PCでは使用せず、Google AI Studio で Gemini API 専用に制限したキーを使ってください。</p>
  </main>
  <script>
    const form=document.querySelector('#form'),key=document.querySelector('#key'),text=document.querySelector('#text'),result=document.querySelector('#result'),error=document.querySelector('#error'),saved=document.querySelector('#saved'),button=document.querySelector('#submit'),history=document.querySelector('#history-list'),search=document.querySelector('#search');
    const labels={short:'短く',bullets:'箇条書き',detailed:'詳しく'};let sort='newest',timer;
    const ownerKey=(()=>{let value=localStorage.getItem('kotonoha-owner-key');if(!value){value=crypto.randomUUID();localStorage.setItem('kotonoha-owner-key',value)}return value})();
    const api=(path,options={})=>fetch(path,{...options,headers:{'Content-Type':'application/json','X-Owner-Key':ownerKey,...(options.headers||{})}});
    const escape=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const preview=value=>value.length>180?value.slice(0,180)+'…':value;
    async function loadHistory(){history.innerHTML='<div class="history-empty">保存した要約を読み込んでいます…</div>';try{const response=await api(`/api/summaries?q=${encodeURIComponent(search.value.trim())}&sort=${sort}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'履歴を読み込めませんでした。');if(!data.items.length){history.innerHTML='<div class="history-empty">まだ保存された要約はありません。</div>';return}history.innerHTML=data.items.map(item=>`<article class="history-item"><div class="history-meta"><span class="pill">${labels[item.summary_type]||item.summary_type}</span>${item.category?`<span class="pill">${escape(item.category)}</span>`:''}${item.summary_date?`<span>${escape(item.summary_date)}</span>`:''}${item.tags?`<span>${escape(item.tags)}</span>`:''}<span>${new Date(item.created_at).toLocaleString('ja-JP')}</span></div><p class="history-title">${escape(item.title||'無題の要約')}</p><p class="history-output">${escape(item.output_text)}</p><p class="history-input">入力：${escape(preview(item.input_text))}</p></article>`).join('')}catch(err){history.innerHTML=`<div class="history-empty">${escape(err.message)}</div>`}}
    document.querySelectorAll('.sort').forEach(control=>control.addEventListener('click',()=>{sort=control.dataset.sort;document.querySelectorAll('.sort').forEach(x=>x.classList.toggle('active',x===control));loadHistory()}));
    search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(loadHistory,250)});
    form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';saved.textContent='';const apiKey=key.value.trim(),source=text.value.trim(),summaryType=document.querySelector('input[name="style"]:checked').value;if(!apiKey||!source)return;button.disabled=true;button.textContent='要約しています…';result.textContent='Geminiが文章を読んでいます…';try{const style={short:'短く、3文以内で',bullets:'重要な点を箇条書きで5点以内に',detailed:'背景と結論が分かるように、丁寧に'}[summaryType];const prompt=`次の文章を日本語で要約してください。形式は「${style}」。事実関係を補わず、元の文章にない情報は書かないでください。\n\n文章:\n${source}`;const response=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({model:'gemini-3.6-flash',input:prompt,store:false})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'Gemini APIに接続できませんでした。');const output=(data.steps||[]).flatMap(step=>step.content||[]).filter(part=>part.type==='text').map(part=>part.text||'').join('').trim();if(!output)throw new Error('要約結果を取得できませんでした。');result.textContent=output;button.textContent='履歴に保存しています…';const save=await api('/api/summaries',{method:'POST',body:JSON.stringify({input_text:source,output_text:output,summary_type:summaryType,title:document.querySelector('#title').value.trim(),category:document.querySelector('#category').value.trim(),summary_date:document.querySelector('#summary-date').value,tags:document.querySelector('#tags').value.trim()})});const savedData=await save.json();if(!save.ok)throw new Error(savedData.error||'要約はできましたが、履歴に保存できませんでした。');saved.textContent='要約を履歴に保存しました。';loadHistory()}catch(err){if(!result.textContent||result.textContent==='Geminiが文章を読んでいます…')result.innerHTML='<span class="empty">ここに要約結果が表示されます。</span>';error.textContent=err.message.includes('API key')?'APIキーを確認してください。':err.message;}finally{button.disabled=false;button.textContent='Geminiで要約して保存'}});
    loadHistory();
  </script>
</body>
</html>
